<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تتبع اليد بمؤثرات النيون التفاعلية</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
        }

        /* حاوية عناصر الفيديو والجرافيك */
        #container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* فيديو الكاميرا يعمل في الخلفية لمعالجة الصور */
        #webcam {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* وضع المرآة لتسهيل التحكم */
            visibility: hidden;
            pointer-events: none;
        }

        /* لوحة الرسم (Canvas) الخاصة بمؤثرات النيون */
        #visuals {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        /* واجهة تحكم وتنبيهات بسيطة */
        #loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00f3ff;
            z-index: 100;
            transition: opacity 0.5s ease;
            text-shadow: 0 0 10px #00f3ff;
        }

        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border-left-color: #00f3ff;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px #00f3ff;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div class="spinner"></div>
            <h2>جاري تشغيل الكاميرا وتحميل الذكاء الاصطناعي...</h2>
            <p>يرجى السماح بالوصول للكاميرا عند طلبها</p>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const loadingOverlay = document.getElementById('loading-overlay');

        // --- إعداد بيئة Three.js لمؤثرات النيون ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // إنشاء جزيئات النيون (Particles)
        const particleCount = 150;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        for(let i=0; i<particleCount; i++) {
            positions[i*3] = positions[i*3+1] = positions[i*3+2] = 9999; 
            colors[i*3] = 0.0;     
            colors[i*3+1] = 0.95;  
            colors[i*3+2] = 1.0;   
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const pMaterial = new THREE.PointsMaterial({
            size: 0.08,
            vertexColors: true,
            transparent: true,
            opacity: 0.85,
            blending: THREE.AdditiveBlending, 
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, pMaterial);
        scene.add(particleSystem);

        let trail = [];
        const maxTrailLength = 80;

        // --- معالجة نتائج تتبع اليد من MediaPipe ---
        function onResults(results) {
            if (loadingOverlay.style.opacity !== '0') {
                loadingOverlay.style.opacity = '0';
                setTimeout(() => loadingOverlay.style.display = 'none', 500);
            }

            const posAttribute = geometry.attributes.position;
            const colAttribute = geometry.attributes.color;
            let particleIndex = 0;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                for (const landmarks of results.multiHandLandmarks) {
                    const fingertips = [4, 8, 12, 16, 20];
                    fingertips.forEach((index, i) => {
                        const pt = landmarks[index];
                        const x = -(pt.x * 2 - 1); 
                        const y = -(pt.y * 2 - 1);
                        trail.push({ x, y, age: 0, hColor: i });
                    });
                }
            }

            for (let i = trail.length - 1; i >= 0; i--) {
                trail[i].age += 1;
                if (trail[i].age > maxTrailLength) {
                    trail.splice(i, 1);
                    continue;
                }

                if (particleIndex < particleCount) {
                    const t = trail[i];
                    const idx = particleIndex * 3;
                    
                    posAttribute.array[idx] = t.x + (Math.random() - 0.5) * 0.015; 
                    posAttribute.array[idx+1] = t.y + (Math.random() - 0.5) * 0.015;
                    posAttribute.array[idx+2] = 0;

                    const lifeRatio = 1.0 - (t.age / maxTrailLength);
                    
                    if(t.hColor === 1) { // السبابة - نيون فوشيا
                        colAttribute.array[idx] = 1.0 * lifeRatio;
                        colAttribute.array[idx+1] = 0.0 * lifeRatio;
                        colAttribute.array[idx+2] = 0.6 * lifeRatio;
                    } else { // باقي الأصابع - نيون سيان
                        colAttribute.array[idx] = 0.0 * lifeRatio;
                        colAttribute.array[idx+1] = 0.9 * lifeRatio;
                        colAttribute.array[idx+2] = 1.0 * lifeRatio;
                    }
                    particleIndex++;
                }
            }

            for (let i = particleIndex; i < particleCount; i++) {
                posAttribute.array[i*3] = 9999;
                posAttribute.array[i*3+1] = 9999;
            }

            posAttribute.needsUpdate = true;
            colAttribute.needsUpdate = true;
            renderer.render(scene, camera);
        }

        // --- إعداد مكتبة MediaPipe Hands ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        // --- تشغيل متوافق ومرن للكاميرا ---
        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({ image: videoElement });
            },
            facingMode: "user",
            width: { ideal: 640 },
            height: { ideal: 480 }
        });
        
        // تشغيل الكاميرا الأساسي، وفي حال الرفض أو عدم التوافق يتم الانتقال للحل البديل تلقائياً
        cameraUtils.start().catch(err => {
            console.log("الانتقال إلى نظام الكاميرا الاحتياطي المرن...");
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: "user",
                    width: { ideal: 640 },
                    height: { ideal: 480 }
                }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                const startTracking = async () => {
                    if(!videoElement.paused && !videoElement.ended) {
                        await hands.send({ image: videoElement });
                    }
                    requestAnimationFrame(startTracking);
                };
                videoElement.onloadedmetadata = () => {
                    startTracking();
                };
            })
            .catch(error => {
                alert("تعذر تشغيل الكاميرا، يرجى التأكد من إعطاء الصلاحية للمتصفح: " + error.message);
            });
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
