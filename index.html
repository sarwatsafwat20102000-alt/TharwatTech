<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النيون الذكية المكتملة (يدين + وجه) ⚡</title>
    
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }
        #container { position: relative; width: 100%; height: 100%; }
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); z-index: 5;
        }
        #visuals { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #040408; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }
        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري دمج تتبع اليدين وقناع الوجه النيوني فائق النقاء...</h3>
            </div>
            <button id="start-btn">إطلاق الطاقة القصوى (يدين + وجه) ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const ctx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       
            [0,5], [5,6], [6,7], [7,8],       
            [5,9], [9,10], [10,11], [11,12],  
            [9,13], [13,14], [14,15], [15,16], 
            [0,17], [17,18], [18,19], [19,20], 
            [5,17] 
        ];

        const FINGER_TIPS = [4, 8, 12, 16, 20];

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // حفظ نتائج الرصد من المحركين لمزامنتها في الرسم
        let latestHandResults = null;
        let latestFaceResults = null;

        function drawDigitalGrid(p1, p2, p3, p4) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
            ctx.closePath(); ctx.clip();

            ctx.fillStyle = 'rgba(0, 243, 255, 0.08)'; ctx.fill();
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)'; ctx.lineWidth = 1.2;

            const minX = Math.min(p1.x, p2.x, p3.x, p4.x), maxX = Math.max(p1.x, p2.x, p3.x, p4.x);
            const minY = Math.min(p1.y, p2.y, p3.y, p4.y), maxY = Math.max(p1.y, p2.y, p3.y, p4.y);
            const space = 25;

            for (let x = minX; x < maxX; x += space) { ctx.beginPath(); ctx.moveTo(x, minY); ctx.lineTo(x, maxY); ctx.stroke(); }
            for (let y = minY; y < maxY; y += space) { ctx.beginPath(); ctx.moveTo(minX, y); ctx.lineTo(maxX, y); ctx.stroke(); }
            ctx.restore();
        }

        // المحرك الرئيسي الموحد للرسم لضمان أعلى كفاءة وثبات
        function drawEverything() {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 1. قسم التعرف على الوجه ورسم المؤثرات (تمت إضافته هنا)
            if (latestFaceResults && latestFaceResults.detectedFaces) {
                for (const face of latestFaceResults.detectedFaces) {
                    const boundingBox = face.boundingBox;
                    const x = (1 - boundingBox.xCenter - boundingBox.width / 2) * canvasElement.width;
                    const y = (boundingBox.yCenter - boundingBox.height / 2) * canvasElement.height;
                    const w = boundingBox.width * canvasElement.width;
                    const h = boundingBox.height * canvasElement.height;

                    const centerX = x + w / 2;
                    const centerY = y + h / 2;
                    const radius = Math.max(w, h) / 1.7;

                    // رسم دائرة النيون حول الوجه
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
                    ctx.strokeStyle = '#00ff66'; ctx.lineWidth = 2.5; ctx.shadowBlur = 12; ctx.shadowColor = '#00ff66';
                    ctx.stroke();

                    // رسم نقاط ليزر فوق العينين
                    if (face.landmarks) {
                        face.landmarks.slice(0, 2).forEach((lm) => {
                            ctx.beginPath();
                            ctx.arc((1 - lm.x) * canvasElement.width, lm.y * canvasElement.height, 5, 0, 2 * Math.PI);
                            ctx.fillStyle = '#ff0055'; ctx.shadowBlur = 10; ctx.shadowColor = '#ff0055';
                            ctx.fill();
                        });
                    }
                }
            }

            // 2. قسم تتبع اليدين ورسم المستطيل الديناميكي الخاص بك
            if (latestHandResults && latestHandResults.multiHandLandmarks) {
                let allHandsTips = [];

                for (const landmarks of latestHandResults.multiHandLandmarks) {
                    CONNECTIONS.forEach((conn) => {
                        const pt1 = landmarks[conn[0]]; const pt2 = landmarks[conn[1]];
                        ctx.beginPath();
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2.5; ctx.shadowBlur = 12; ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    });

                    landmarks.forEach((pt) => {
                        ctx.beginPath(); ctx.arc((1 - pt.x) * canvasElement.width, pt.y * canvasElement.height, 5, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00f3ff'; ctx.fill();
                    });

                    let tips = FINGER_TIPS.map(index => {
                        return {
                            id: index,
                            x: (1 - landmarks[index].x) * canvasElement.width,
                            y: landmarks[index].y * canvasElement.height
                        };
                    });
                    allHandsTips.push(tips);
                }

                if (allHandsTips.length === 2) {
                    const hand1 = allHandsTips[0]; const hand2 = allHandsTips[1];
                    let closestPairs = [];

                    for (let i = 0; i < hand1.length; i++) {
                        for (let j = 0; j < hand2.length; j++) {
                            let dist = getDistance(hand1[i], hand2[j]);
                            closestPairs.push({ h1Tip: hand1[i], h2Tip: hand2[j], distance: dist });
                        }
                    }

                    closestPairs.sort((a, b) => a.distance - b.distance);
                    const pair1 = closestPairs[0]; 
                    
                    let pair2 = null;
                    for (let k = 1; k < closestPairs.length; k++) {
                        if (closestPairs[k].h1Tip.id !== pair1.h1Tip.id && closestPairs[k].h2Tip.id !== pair1.h2Tip.id) {
                            pair2 = closestPairs[k];
                            break;
                        }
                    }

                    if (pair1 && pair2) {
                        const topLeft = pair1.h1Tip, bottomLeft = pair1.h2Tip;
                        const bottomRight = pair2.h2Tip, topRight = pair2.h1Tip;

                        drawDigitalGrid(topLeft, bottomLeft, bottomRight, topRight);

                        ctx.beginPath();
                        ctx.moveTo(topLeft.x, topLeft.y); ctx.lineTo(bottomLeft.x, bottomLeft.y);
                        ctx.lineTo(bottomRight.x, bottomRight.y); ctx.lineTo(topRight.x, topRight.y);
                        ctx.closePath();

                        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 4.5; ctx.shadowBlur = 25; ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(drawEverything);
        }

        // تهيئة محرك اليدين من روابط السيرفر السريع
        const hands = new Hands({ locateFile: (file) => `https://unpkg.com/@mediapipe/hands/${file}` });
        hands.setOptions({ maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults((results) => { latestHandResults = results; });

        // تهيئة محرك الوجه من روابط السيرفر السريع
        const faceDetection = new FaceDetection({ locateFile: (file) => `https://unpkg.com/@mediapipe/face_detection/${file}` });
        faceDetection.setOptions({ modelSelection: 0, minDetectionConfidence: 0.5 });
        faceDetection.onResults((results) => { latestFaceResults = results; });

        // تشغيل فوري بمجرد تحميل المحركين
        Promise.all([hands.initialize(), faceDetection.initialize()]).then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "اكتمل دمج النظام بالكامل!";
            startBtn.style.display = 'block';
        });

        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            // دقة HD كاملة لاستغلال الـ 48 ميجابكسل ومنع البكسلة
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { 
                            await hands.send({ image: videoElement }); 
                            await faceDetection.send({ image: videoElement }); 
                        } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };

                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(() => { processVideo(); drawEverything(); });
                };
            });
        });
    </script>
</body>
</html>
