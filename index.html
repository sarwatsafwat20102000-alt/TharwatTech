<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام رصد وعد الأصابع الذكي الصافي ⚡✋</title>
    
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }
        #container { position: relative; width: 100%; height: 100%; }
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); z-index: 5;
        }
        #visuals { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #040408; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00ffcc;
            z-index: 100; text-shadow: 0 0 10px #00ffcc; padding: 20px; text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 255, 204, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00ffcc;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        #start-btn {
            display: none; background: transparent; color: #00ffcc;
            border: 2px solid #00ffcc; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); transition: all 0.3s;
        }
        #start-btn:active { transform: scale(0.95); background: #00ffcc; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري تشغيل محرك الذكاء الاصطناعي لعد الأصابع...</h3>
            </div>
            <button id="start-btn">ابدأ تشغيل الكاميرا والعد ⚡✋</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const ctx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // روابط الهيكل العظمي لليد
        const CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       
            [0,5], [5,6], [6,7], [7,8],       
            [5,9], [9,10], [10,11], [11,12],  
            [9,13], [13,14], [14,15], [15,16], 
            [0,17], [17,18], [18,19], [19,20], 
            [5,17] 
        ];

        // دالة مخصصة لرسم رقم نيون فوق طرف كل إصبع مرفوع
        function drawFingerNumber(x, y, text) {
            ctx.save();
            // رسم دائرة نيونية خلفية تحت الرقم ليظهر بوضوح سينمائي
            ctx.beginPath();
            ctx.arc(x, y - 25, 16, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
            ctx.strokeStyle = "#00ffcc";
            ctx.lineWidth = 2;
            ctx.shadowBlur = 10;
            ctx.shadowColor = "#00ffcc";
            ctx.fill();
            ctx.stroke();

            // طباعة الرقم داخل الدائرة
            ctx.font = "bold 15px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(text, x, y - 25);
            ctx.restore();
        }

        // دالة لإظهار لوحة إجمالي عدد الأصابع المرفوعة في زاوية الشاشة
        function drawTotalCountHUD(totalCount) {
            ctx.save();
            ctx.font = "bold 32px sans-serif";
            ctx.fillStyle = "#ffffff";
            ctx.shadowBlur = 12;
            ctx.shadowColor = "#00ffcc";
            ctx.fillText(`إجمالي الأصابع: ${totalCount}`, 40, 65);
            ctx.restore();
        }

                        const pt1 = landmarks[conn[0]]; const pt2 = landmarks[conn[1]];
                        ctx.beginPath();
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2.5; ctx.shadowBlur = 10; ctx.shadowColor = '#00ffcc';
                        ctx.stroke();

                    landmarks.forEach((pt) => {
                        ctx.beginPath(); ctx.arc((1 - pt.x) * canvasElement.width, pt.y * canvasElement.height, 4, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff'; ctx.fill();
                    });

                    let currentHandFingerCount = 1; // عداد ترقيم الأصابع لليد الحالية
                    const isLeftHand = results.multiHandedness[handIndex].label === 'Left';

                    let thumbOpen = isLeftHand ? (landmarks[4].x > landmarks[2].x) : (landmarks[4].x < landmarks[2].x);
                    if (thumbOpen) {
                        drawFingerNumber((1 - landmarks[4].x) * canvasElement.width, landmarks[4].y * canvasElement.height, currentHandFingerCount);
                        currentHandFingerCount++;
                        totalFingersOpen++;
                    }

                    // --- فحص باقي الأصابع الأربعة عمودياً ---
                    // السبابة (نقطة 8)
                    if (landmarks[8].y < landmarks[6].y) {
                        drawFingerNumber((1 - landmarks[8].x) * canvasElement.width, landmarks[8].y * canvasElement.height, currentHandFingerCount);
                        currentHandFingerCount++;
                        totalFingersOpen++;
                    }

                        currentHandFingerCount++;
                        totalFingersOpen++;
