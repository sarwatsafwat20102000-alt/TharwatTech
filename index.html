<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النيون الديناميكية الذكية ⚡</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }

        #container { position: relative; width: 100%; height: 100%; }

        /* الكاميرا تغطي الشاشة بالكامل كخلفية حية */
        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* وضع المرآة ليتطابق الاتجاه مع حركتك */
            z-index: 5;
        }

        /* شاشة الرسم ثنائية الأبعاد السريعة فوق الكاميرا */
        #visuals {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 10;
            pointer-events: none;
        }

        /* واجهة التحميل والبدء لتفادي قيود المتصفح */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #040408; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }

        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }

        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري دمج تتبع اليدين بالذكاء الاصطناعي الديناميكي...</h3>
            </div>
            <button id="start-btn">إطلاق البوابة الليزرية المتغيرة ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const ctx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        // ضبط الأبعاد التلقائية لتطابق حجم شاشة الموبايل
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // الروابط البرمجية لهيكل مفاصل اليد الأساسية
        const CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       
            [0,5], [5,6], [6,7], [7,8],       
            [5,9], [9,10], [10,11], [11,12],  
            [9,13], [13,14], [14,15], [15,16], 
            [0,17], [17,18], [18,19], [19,20], 
            [5,17] 
        ];

        // مصفوفة تحتوي على أرقام أطراف الأصابع الخمسة فقط (4=الإبهام، 8=السبابة، 12=الوسطى، 16=البنصر، 20=الخنصر)
        const FINGER_TIPS = [4, 8, 12, 16, 20];

        // دالة رياضية سريعة لحساب المسافة بين نقطتين في الفراغ
        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // --- معالجة نتائج التتبع والرصد الديناميكي السريع للأصابع ---
        function onResults(results) {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                let allHandsTips = []; // مصفوفة لتخزين أطراف الأصابع لكل يد مرصودة

                // 1. رسم المفاصل والخطوط لكل يد تظهر في الكاميرا
                for (const landmarks of results.multiHandLandmarks) {
                    
                    // رسم هيكل النيون المتوهج لليد
                    CONNECTIONS.forEach((conn) => {
                        const pt1 = landmarks[conn[0]];
                        const pt2 = landmarks[conn[1]];

                        ctx.beginPath();
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        ctx.strokeStyle = '#00f3ff';
                        ctx.lineWidth = 2.5;
                        ctx.shadowBlur = 12;
                        ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    });

                    // رسم النقاط فوق مفاصل الأصابع
                    landmarks.forEach((pt) => {
                        ctx.beginPath();
                        ctx.arc((1 - pt.x) * canvasElement.width, pt.y * canvasElement.height, 4, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#00f3ff';
                        ctx.fill();
                    });

                    // استخراج إحداثيات الشاشة لأطراف الأصابع الخمسة فقط لليد الحالية
                    let tips = FINGER_TIPS.map(index => {
                        return {
                            id: index,
                            x: (1 - landmarks[index].x) * canvasElement.width,
                            y: landmarks[index].y * canvasElement.height
                        };
                    });
                    allHandsTips.push(tips);
                }

                // 🌟 المحرك الديناميكي الخارق: إذا تم رصد يدين اثنتين معاً في الكاميرا
                if (allHandsTips.length === 2) {
                    const hand1 = allHandsTips[0];
                    const hand2 = allHandsTips[1];

                    let closestPairs = [];

                    // قياس المسافات بين كل أطراف أصابع اليد الأولى مع كل أطراف اليد الثانية برمجياً
                    for (let i = 0; i < hand1.length; i++) {
                        for (let j = 0; j < hand2.length; j++) {
                            let dist = getDistance(hand1[i], hand2[j]);
                            closestPairs.push({
                                h1Tip: hand1[i],
                                h2Tip: hand2[j],
                                distance: dist
                            });
                        }
                    }

                    // ترتيب المصفوفة تصاعدياً للحصول على أقرب الأصابع مسافةً من بعضها البعض
                    closestPairs.sort((a, b) => a.distance - b.distance);

                    // استخراج أقرب إصبعين من اليد الأولى لأقرب إصبعين من اليد الثانية ديناميكياً
                    // الزوج الأول يمثل النقطتين الأقرب على الإطلاق
                    const pair1 = closestPairs[0]; 
                    
                    // البحث عن الزوج الثاني الأقرب بشرط أن يكون لأصابع مختلفة لضمان رسم مستطيل صحيح
                    let pair2 = null;
                    for (let k = 1; k < closestPairs.length; k++) {
                        if (closestPairs[k].h1Tip.id !== pair1.h1Tip.id && closestPairs[k].h2Tip.id !== pair1.h2Tip.id) {
                            pair2 = closestPairs[k];
                            break;
                        }
                    }

                    // إذا تم العثور على أركان المستطيل الأربعة الديناميكية، قم برسم البوابة الليزرية فوراً!
                    if (pair1 && pair2) {
                        ctx.beginPath();
                        ctx.moveTo(pair1.h1Tip.x, pair1.h1Tip.y); // ركن 1: الإصبع الأول الأقرب من اليد أ
                        ctx.lineTo(pair1.h2Tip.x, pair1.h2Tip.y); // ركن 2: الإصبع الأول الأقرب من اليد ب
                        ctx.lineTo(pair2.h2Tip.x, pair2.h2Tip.y); // ركن 3: الإصبع الثاني الأقرب من اليد ب
                        ctx.lineTo(pair2.h1Tip.x, pair2.h1Tip.y); // ركن 4: الإصبع الثاني الأقرب من اليد أ
                        ctx.closePath();

                        // تصميم المستطيل النيوني المشع فائق التوهج (Sci-Fi Hologram)
                        ctx.strokeStyle = '#00f3ff';
                        ctx.lineWidth = 4.5;
                        ctx.shadowBlur = 25; // هالة نيون عريضة وواضحة جداً
                        ctx.shadowColor = '#00f3ff';
                        ctx.stroke();

                        // ملء المستطيل من الداخل بلون ليزري شفاف ليعطي عمق الواجهات الذكية
                        ctx.fillStyle = 'rgba(0, 243, 255, 0.07)';
                        ctx.fill();
                    }
                }
            }
        }

        // --- تهيئة الذكاء الاصطناعي وإعدادات تخفيف الحمل على معالج هاتف A51 ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2,          // السماح برصد يدين اثنتين معاً
            modelComplexity: 0,      // استخدام النموذج فائق السرعة والمحسن للموبايل لضمان قراءة اليدين دون سقوط
            minDetectionConfidence: 0.45, 
            minTrackingConfidence: 0.45
        });
        hands.onResults(onResults);

        hands.initialize().then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "اكتمل المحرك الحركي المتغير! جاهز للتشغيل.";
            startBtn.style.display = 'block';
        });

        // تشغيل الكاميرا بدقة ذكية خفيفة لضمان ثبات التتبع دون استهلاك ذاكرة الهاتف
        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: 320, height: 240 }, // الدقة المثالية لتشغيل اليدين معاً على المتصفح بسلاسة
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { await hands.send({ image: videoElement }); } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };

                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(() => { processVideo(); });
                };
            })
            .catch(error => {
                alert("يرجى إعطاء المتصفح صلاحية الوصول للكاميرا: " + error.message);
            });
        });
    </script>
</body>
</html>
