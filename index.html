<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هولوغرام النيون التفاعلي المتكامل</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030305; font-family: sans-serif;
        }

        #container { position: relative; width: 100%; height: 100%; }

        /* كاميرا المراقبة الصغيرة في الزاوية للتأكد من التشغيل */
        #webcam {
            position: absolute; bottom: 15px; right: 15px;
            width: 100px; height: 133px; object-fit: cover;
            transform: scaleX(-1); border-radius: 12px;
            border: 2px solid #00f3ff; z-index: 50;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); background: #000;
        }

        #visuals { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; }

        /* شاشة البدء وتخطي حظر المتصفح */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #05050a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }

        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }

        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري تحضير قوة الهولوغرام السحرية...</h3>
            </div>
            <button id="start-btn">تفعيل مظهر السوبر باور ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        // --- إعداد مشهد الـ Three.js ثلاثي الأبعاد المتطور ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 1. صنع نقاط مضيئة متوهجة لكل مفصل من مفاصل اليد (21 مفصل)
        const jointCount = 21;
        const dotGeometry = new THREE.BufferGeometry();
        const dotPositions = new Float32Array(jointCount * 3);
        const dotColors = new Float32Array(jointCount * 3);

        // وضع مفاصل افتراضية خارج الشاشة في البداية
        for(let i=0; i<jointCount; i++) {
            dotPositions[i*3] = dotPositions[i*3+1] = dotPositions[i*3+2] = 9999;
            dotColors[i*3] = 0.0; dotColors[i*3+1] = 0.95; dotColors[i*3+2] = 1.0; // نيون سيان
        }
        dotGeometry.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));
        dotGeometry.setAttribute('color', new THREE.BufferAttribute(dotColors, 3));

        const dotMaterial = new THREE.PointsMaterial({
            size: 0.05, vertexColors: true, transparent: true, opacity: 1.0,
            blending: THREE.AdditiveBlending, depthWrite: false
        });
        const jointPoints = new THREE.Points(dotGeometry, dotMaterial);
        scene.add(jointPoints);

        // 2. صنع الخطوط النيون المتصلة (الهيكل العظمي للهولوغرام)
        // روابط المفاصل في معيار MediaPipe لرسم خطوط اليد بالكامل
        const CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       // الإبهام
            [0,5], [5,6], [6,7], [7,8],       // السبابة
            [5,9], [9,10], [10,11], [11,12],  // الوسطى
            [9,13], [13,14], [14,15], [15,16], // البنصر
            [0,17], [17,18], [18,19], [19,20], // الخنصر
            [5,17] // أسفل الكف
        ];

        const lineMaterials = [];
        const lineGeometries = [];
        const lines = [];

        // إنشاء مجسمات الخطوط النيون المتوهجة واضافتها للمشهد
        CONNECTIONS.forEach(() => {
            const geom = new THREE.BufferGeometry();
            const pos = new Float32Array(2 * 3); // نقطتين لكل خط
            geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            // مادة الخط بلون نيون فوسفوري متوهج
            const mat = new THREE.LineBasicMaterial({
                color: 0x00f3ff, transparent: true, opacity: 0.7,
                blending: THREE.AdditiveBlending, linewidth: 3 // ملاحظة: المتصفحات تدعم سمك 1 غالباً لذا نعتمد على التوهج
            });
            
            const line = new THREE.Line(geom, mat);
            scene.add(line);
            lines.push(line);
            lineGeometries.push(geom);
        });


        // --- معالجة حركة اليد وبناء تأثير الهولوغرام الفوري ---
        function onResults(results) {
            const dotPosAttr = dotGeometry.attributes.position;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0]; // التركيز على اليد الأولى

                // تحديث أماكن النقاط المضيئة (المفاصل)
                for (let i = 0; i < jointCount; i++) {
                    const pt = landmarks[i];
                    const x = -(pt.x * 2 - 1);
                    const y = -(pt.y * 2 - 1);

                    dotPosAttr.array[i*3] = x;
                    dotPosAttr.array[i*3+1] = y;
                    dotPosAttr.array[i*3+2] = 0;
                }
                dotPosAttr.needsUpdate = true;

                // تحديث الخطوط النيون لتصل بين المفاصل بدقة
                CONNECTIONS.forEach((conn, index) => {
                    const pt1 = landmarks[conn[0]];
                    const pt2 = landmarks[conn[1]];

                    const x1 = -(pt1.x * 2 - 1); const y1 = -(pt1.y * 2 - 1);
                    const x2 = -(pt2.x * 2 - 1); const y2 = -(pt2.y * 2 - 1);

                    const linePosAttr = lineGeometries[index].attributes.position;
                    linePosAttr.array[0] = x1; linePosAttr.array[1] = y1; linePosAttr.array[2] = 0;
                    linePosAttr.array[3] = x2; linePosAttr.array[4] = y2; linePosAttr.array[5] = 0;
                    linePosAttr.needsUpdate = true;
                    lines[index].visible = true;
                });

            } else {
                // إخفاء كل شيء إذا اختفت اليد من الكاميرا
                for (let i = 0; i < jointCount; i++) {
                    dotPosAttr.array[i*3] = 9999;
                }
                dotPosAttr.needsUpdate = true;
                lines.forEach(l => l.visible = false);
            }

            renderer.render(scene, camera);
        }

        // --- إعداد مكتبة تتبع اليد ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6
        });
        hands.onResults(onResults);

        // تفعيل زر البدء عند اكتمال التحميل
        hands.initialize().then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "طاقة النيون جاهزة للانطلاق!";
            startBtn.style.display = 'block';
        });

        // تشغيل الكاميرا عند ضغط زر "تفعيل مظهر السوبر باور"
        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { await hands.send({ image: videoElement }); } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };

                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(() => { processVideo(); });
                };
            })
            .catch(error => {
                alert("برجاء السماح بصلاحية الكاميرا لإظهار السوبر باور: " + error.message);
            });
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
