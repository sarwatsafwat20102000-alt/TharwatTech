<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النيون الشبكية الموحدة (وجه + يدين متطابقين) ⚡</title>
    
    <script src="https://unpkg.com/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }
        #container { position: relative; width: 100%; height: 100%; }
        #webcam {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); z-index: 5;
        }
        #visuals { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #040408; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }
        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }
        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري بناء الشبكة النيونية الموحدة للوجه واليدين...</h3>
            </div>
            <button id="start-btn">إطلاق البوابة الشبكية الكاملة ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const ctx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // اتصالات اليدين المعتادة الخاصة بك
        const HAND_CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       
            [0,5], [5,6], [6,7], [7,8],       
            [5,9], [9,10], [10,11], [11,12],  
            [9,13], [13,14], [14,15], [15,16], 
            [0,17], [17,18], [18,19], [19,20], 
            [5,17] 
        ];

        const FINGER_TIPS = [4, 8, 12, 16, 20];

        // خريطة ذكية مختصرة لأبرز خطوط وتفاصيل الوجه المتصلة (لضمان سرعة الأداء وعدم التهنيج)
        const FACE_LINES = [
            // إطار الوجه الخارجي
            [10, 338], [338, 297], [297, 332], [332, 284], [284, 251], [251, 389], [389, 356], [356, 454], [454, 323], [323, 361], [361, 288], [288, 397], [397, 365], [365, 379], [379, 378], [378, 400], [400, 377], [377, 152],
            [152, 148], [148, 176], [176, 149], [149, 150], [150, 136], [136, 172], [172, 58], [58, 132], [132, 93], [93, 234], [234, 127], [127, 162], [162, 21], [21, 54], [54, 103], [103, 67], [67, 109], [109, 10],
            // العين اليسرى والشفاه
            [33, 160], [160, 158], [158, 133], [133, 153], [153, 144], [144, 33],
            // العين اليمنى
            [362, 387], [387, 385], [385, 263], [263, 373], [373, 380], [380, 362],
            // الشفاه الخارجية
            [61, 37], [37, 0], [0, 267], [267, 291], [291, 321], [321, 405], [405, 17], [17, 181], [181, 91], [91, 61]
        ];

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        function drawDigitalGrid(p1, p2, p3, p4) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
            ctx.closePath(); ctx.clip();

            ctx.fillStyle = 'rgba(0, 243, 255, 0.08)'; ctx.fill();
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)'; ctx.lineWidth = 1.2;

            const minX = Math.min(p1.x, p2.x, p3.x, p4.x), maxX = Math.max(p1.x, p2.x, p3.x, p4.x);
            const minY = Math.min(p1.y, p2.y, p3.y, p4.y), maxY = Math.max(p1.y, p2.y, p3.y, p4.y);
            const space = 25;

            for (let x = minX; x < maxX; x += space) { ctx.beginPath(); ctx.moveTo(x, minY); ctx.lineTo(x, maxY); ctx.stroke(); }
            for (let y = minY; y < maxY; y += space) { ctx.beginPath(); ctx.moveTo(minX, y); ctx.lineTo(maxX, y); ctx.stroke(); }
            ctx.restore();
        }

        function onResults(results) {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            // 🔥 1. تعديل رسم الوجه: رسم خطوط نيون متصلة ونقاط مفاصل مثل اليد تماماً!
            if (results.faceLandmarks) {
                // رسم الخطوط المتصلة للوجه (نيون أخضر)
                FACE_LINES.forEach((conn) => {
                    const pt1 = results.faceLandmarks[conn[0]];
                    const pt2 = results.faceLandmarks[conn[1]];

                    if (pt1 && pt2) {
                        ctx.beginPath();
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        ctx.strokeStyle = '#00ff66'; // نيون أخضر سايبر
                        ctx.lineWidth = 1.5;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#00ff66';
                        ctx.stroke();
                    }
                });

                // رسم نقاط مفاصل الوجه الرئيسية (نقاط بيضاء متوهجة)
                FACE_LINES.forEach((conn) => {
                    const pt = results.faceLandmarks[conn[0]];
                    if (pt) {
                        ctx.beginPath();
                        ctx.arc((1 - pt.x) * canvasElement.width, pt.y * canvasElement.height, 2.5, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff'; // توهج أبيض متطابق مع اليد
                        ctx.shadowBlur = 5;
                        ctx.shadowColor = '#00ff66';
                        ctx.fill();
                    }
                });
            }

            // 2. كود الأيدي والمستطيل والشبكة الأصلي الخاص بك (نيون أزرق)
            let allHandsLandmarks = [];
            if (results.leftHandLandmarks) allHandsLandmarks.push(results.leftHandLandmarks);
            if (results.rightHandLandmarks) allHandsLandmarks.push(results.rightHandLandmarks);

            if (allHandsLandmarks.length > 0) {
                let allHandsTips = [];

                for (const landmarks of allHandsLandmarks) {
                    HAND_CONNECTIONS.forEach((conn) => {
                        const pt1 = landmarks[conn[0]]; const pt2 = landmarks[conn[1]];
                        ctx.beginPath();
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2.5; ctx.shadowBlur = 12; ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    });

                    landmarks.forEach((pt) => {
                        ctx.beginPath(); ctx.arc((1 - pt.x) * canvasElement.width, pt.y * canvasElement.height, 5, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 8; ctx.shadowColor = '#00f3ff'; ctx.fill();
                    });

                    let tips = FINGER_TIPS.map(index => {
                        return {
                            id: index,
                            x: (1 - landmarks[index].x) * canvasElement.width,
                            y: landmarks[index].y * canvasElement.height
                        };
                    });
                    allHandsTips.push(tips);
                }

                if (allHandsTips.length === 2) {
                    const hand1 = allHandsTips[0]; const hand2 = allHandsTips[1];
                    let closestPairs = [];

                    for (let i = 0; i < hand1.length; i++) {
                        for (let j = 0; j < hand2.length; j++) {
                            let dist = getDistance(hand1[i], hand2[j]);
                            closestPairs.push({ h1Tip: hand1[i], h2Tip: hand2[j], distance: dist });
                        }
                    }

                    closestPairs.sort((a, b) => a.distance - b.distance);
                    const pair1 = closestPairs[0]; 
                    
                    let pair2 = null;
                    for (let k = 1; k < closestPairs.length; k++) {
                        if (closestPairs[k].h1Tip.id !== pair1.h1Tip.id && closestPairs[k].h2Tip.id !== pair1.h2Tip.id) {
                            pair2 = closestPairs[k];
                            break;
                        }
                    }

                    if (pair1 && pair2) {
                        const topLeft = pair1.h1Tip, bottomLeft = pair1.h2Tip;
                        const bottomRight = pair2.h2Tip, topRight = pair2.h1Tip;

                        drawDigitalGrid(topLeft, bottomLeft, bottomRight, topRight);

                        ctx.beginPath();
                        ctx.moveTo(topLeft.x, topLeft.y); ctx.lineTo(bottomLeft.x, bottomLeft.y);
                        ctx.lineTo(bottomRight.x, bottomRight.y); ctx.lineTo(topRight.x, topRight.y);
                        ctx.closePath();

                        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 4.5; ctx.shadowBlur = 25; ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    }
                }
            }
        }

        const holistic = new Holistic({
            locateFile: (file) => `https://unpkg.com/@mediapipe/holistic/${file}`
        });

        holistic.setOptions({
            modelComplexity: 0,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        holistic.onResults(onResults);

        holistic.initialize().then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "اكتمل دمج الشبكة الموحدة!";
            startBtn.style.display = 'block';
        });

        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 720 } }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { await holistic.send({ image: videoElement }); } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };

                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(() => { processVideo(); });
                };
            })
            .catch(error => {
                alert("صلاحية الكاميرا مطلوبة: " + error.message);
            });
        });
    </script>
</body>
</html>
