<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>السوبر باور الكامل - واجهة الفيسبوك الهولوغرامية ⚡</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }

        #container { position: relative; width: 100%; height: 100%; }

        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1);
            z-index: 5;
        }

        #visuals {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 10;
            pointer-events: none;
        }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #040408; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }

        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }

        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري تفعيل شاشة الجرافيك النيوني الرقمية الحية...</h3>
            </div>
            <button id="start-btn">إطلاق طاقة الهولوغرام ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const ctx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // الروابط لربط المفاصل برسم نيون خفيف وسريع جداً
        const CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       
            [0,5], [5,6], [6,7], [7,8],       
            [5,9], [9,10], [10,11], [11,12],  
            [9,13], [13,14], [14,15], [15,16], 
            [0,17], [17,18], [18,19], [19,20], 
            [5,17] 
        ];

        // دالة فائقة الخفة لرسم تأثير ومربعات الـ Digital Grid Overlay بالداخل
        function drawDigitalGrid(p1, p2, p3, p4) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.clip(); // حصر الرسم بالداخل فقط

            // 1. تعبئة الخلفية باللون الأزرق الليزري الشفاف
            ctx.fillStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.fill();

            // 2. رسم خطوط الشبكة الهندسية (مربعات واجهة المستخدم)
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 0; // إيقاف التوهج الداخلي حمايةً للمعالج

            const minX = Math.min(p1.x, p2.x, p3.x, p4.x);
            const maxX = Math.max(p1.x, p2.x, p3.x, p4.x);
            const minY = Math.min(p1.y, p2.y, p3.y, p4.y);
            const maxY = Math.max(p1.y, p2.y, p3.y, p4.y);

            const space = 20; // حجم المربع الرقمي بالداخل

            for (let x = minX; x < maxX; x += space) {
                ctx.beginPath(); ctx.moveTo(x, minY); ctx.lineTo(x, maxY); ctx.stroke();
            }
            for (let y = minY; y < maxY; y += space) {
                ctx.beginPath(); ctx.moveTo(minX, y); ctx.lineTo(maxX, y); ctx.stroke();
            }
            ctx.restore();
        }

        function onResults(results) {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                let handData = [];

                for (const landmarks of results.multiHandLandmarks) {
                    // رسم مفاصل وخطوط أصابع اليد
                    CONNECTIONS.forEach((conn) => {
                        const pt1 = landmarks[conn[0]]; const pt2 = landmarks[conn[1]];
                        ctx.beginPath();
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2; ctx.shadowBlur = 5; ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    });

                    // حفظ قيم السبابة (8) والإبهام (4) لليد الحالية
                    handData.push({
                        thumb: { x: (1 - landmarks[4].x) * canvasElement.width, y: landmarks[4].y * canvasElement.height },
                        index: { x: (1 - landmarks[8].x) * canvasElement.width, y: landmarks[8].y * canvasElement.height }
                    });
                }

                // الكود يلتقط اليدين معاً ويرسم واجهة النيون المشعة والشبكة الرقمية فوراً!
                if (handData.length === 2) {
                    // فرز اليد اليسرى واليد اليمنى بناءً على موقعهما على الشاشة لمنع التقاطع المعيب
                    handData.sort((a, b) => a.index.x - b.index.x);

                    const leftHand = handData[0];  // اليد التي تقع على اليسار
                    const rightHand = handData[1]; // اليد التي تقع على اليمين

                    // تحديد نقاط المستطيل الأربعة بالترتيب الدائري السليم
                    const topLeft = leftHand.index;
                    const bottomLeft = leftHand.thumb;
                    const topRight = rightHand.index;
                    const bottomRight = rightHand.thumb;

                    // أولاً: رسم الشبكة الرقمية الداخلية (Digital Grid Overlay)
                    drawDigitalGrid(topLeft, topRight, bottomRight, bottomLeft);

                    // ثانياً: رسم إطار مستطيل الليزر الخارجي عالي التوهج
                    ctx.beginPath();
                    ctx.moveTo(topLeft.x, topLeft.y);
                    ctx.lineTo(topRight.x, topRight.y);
                    ctx.lineTo(bottomRight.x, bottomRight.y);
                    ctx.lineTo(bottomLeft.x, bottomLeft.y);
                    ctx.closePath();

                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 4;
                    ctx.shadowBlur = 20; // الهالة المضيئة العريضة المحيطة بالبوابة
                    ctx.shadowColor = '#00f3ff';
                    ctx.stroke();
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        // إعداد متوازن يضمن استقرار الكود على هاتف A51 بدون تجميد
        hands.setOptions({
            maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.4, minTrackingConfidence: 0.4
        });
        hands.onResults(onResults);

        hands.initialize().then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "شاشة الجرافيك المضيئة جاهزة للتفعيل!";
            startBtn.style.display = 'block';
        });

        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: 320, height: 240 }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { await hands.send({ image: videoElement }); } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };
                videoElement.onloadedmetadata = () => { videoElement.play().then(() => { processVideo(); }); };
            });
        });
    </script>
</body>
</html>
