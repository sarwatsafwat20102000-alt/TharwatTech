<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>واجهة النيون الهولوغرامية المتكاملة ⚡</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }

        #container { position: relative; width: 100%; height: 100%; }

        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1);
            z-index: 5;
        }

        #visuals {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 10;
            pointer-events: none;
        }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #040408; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }

        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }

        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري بناء الخوارزمية الهولوغرامية وشحن النيون...</h3>
            </div>
            <button id="start-btn">إطلاق الواجهة الليزرية بالكامل ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const ctx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       
            [0,5], [5,6], [6,7], [7,8],       
            [5,9], [9,10], [10,11], [11,12],  
            [9,13], [13,14], [14,15], [15,16], 
            [0,17], [17,18], [18,19], [19,20], 
            [5,17] 
        ];

        const FINGER_TIPS = [4, 8, 12, 16, 20];

        function getDistance(p1, p2) {
            return Math.sqrt(Math.pow(p1.x - p2.x, 2) + Math.pow(p1.y - p2.y, 2));
        }

        // دالة سحرية لرسم تأثير شبكة الهولوغرام بداخل المستطيل
        function drawHologramGrid(p1, p2, p3, p4) {
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p1.x, p1.y);
            ctx.lineTo(p2.x, p2.y);
            ctx.lineTo(p3.x, p3.y);
            ctx.lineTo(p4.x, p4.y);
            ctx.closePath();
            ctx.clip(); // حصر الرسم داخل حدود المستطيل فقط

            // 1. ملء الخلفية بلون أزرق ليزري شفاف
            ctx.fillStyle = 'rgba(0, 243, 255, 0.08)';
            ctx.fill();

            // 2. رسم خطوط الشبكة الرقمية المتقاطعة (Grid) كما في خيال الفيسبوك العلمية
            ctx.strokeStyle = 'rgba(0, 243, 255, 0.15)';
            ctx.lineWidth = 1;
            ctx.shadowBlur = 0; // إلغاء التوهج للخطوط الداخلية للحفاظ على الأداء

            const boundsMinX = Math.min(p1.x, p2.x, p3.x, p4.x);
            const boundsMaxX = Math.max(p1.x, p2.x, p3.x, p4.x);
            const boundsMinY = Math.min(p1.y, p2.y, p3.y, p4.y);
            const boundsMaxY = Math.max(p1.y, p2.y, p3.y, p4.y);

            const gridSpacing = 25; // المسافة بين مربعات الشبكة

            for (let x = boundsMinX; x < boundsMaxX; x += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(x, boundsMinY); ctx.lineTo(x, boundsMaxY); ctx.stroke();
            }
            for (let y = boundsMinY; y < boundsMaxY; y += gridSpacing) {
                ctx.beginPath(); ctx.moveTo(boundsMinX, y); ctx.lineTo(boundsMaxX, y); ctx.stroke();
            }
            ctx.restore();
        }

        function onResults(results) {
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                let allHandsTips = [];

                for (const landmarks of results.multiHandLandmarks) {
                    // رسم خطوط اليد
                    CONNECTIONS.forEach((conn) => {
                        const pt1 = landmarks[conn[0]]; const pt2 = landmarks[conn[1]];
                        ctx.beginPath();
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        ctx.strokeStyle = '#00f3ff'; ctx.lineWidth = 2; ctx.shadowBlur = 10; ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    });

                    // رسم نقط المفاصل
                    landmarks.forEach((pt) => {
                        ctx.beginPath(); ctx.arc((1 - pt.x) * canvasElement.width, pt.y * canvasElement.height, 4, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 6; ctx.shadowColor = '#00f3ff'; ctx.fill();
                    });

                    let tips = FINGER_TIPS.map(index => {
                        return { id: index, x: (1 - landmarks[index].x) * canvasElement.width, y: landmarks[index].y * canvasElement.height };
                    });
                    allHandsTips.push(tips);
                }

                // هندسة تتبع أقرب الأصابع وبناء المستطيل المكتمل
                if (allHandsTips.length === 2) {
                    const hand1 = allHandsTips[0];
                    const hand2 = allHandsTips[1];

                    let closestPairs = [];
                    for (let i = 0; i < hand1.length; i++) {
                        for (let j = 0; j < hand2.length; j++) {
                            closestPairs.push({ h1Tip: hand1[i], h2Tip: hand2[j], distance: getDistance(hand1[i], hand2[j]) });
                        }
                    }
                    closestPairs.sort((a, b) => a.distance - b.distance);

                    const pair1 = closestPairs[0];
                    let pair2 = null;
                    for (let k = 1; k < closestPairs.length; k++) {
                        if (closestPairs[k].h1Tip.id !== pair1.h1Tip.id && closestPairs[k].h2Tip.id !== pair1.h2Tip.id) {
                            pair2 = closestPairs[k];
                            break;
                        }
                    }

                    if (pair1 && pair2) {
                        // الأركان الأربعة الخام من الأصابع المقتربة
                        const ptA = pair1.h1Tip; // يد 1، إصبع 1
                        const ptB = pair1.h2Tip; // يد 2، إصبع 1
                        const ptC = pair2.h2Tip; // يد 2، إصبع 2
                        const ptD = pair2.h1Tip; // يد 1، إصبع 2

                        // 🔥 التعديل الهندسي الحاسم: ترتيب النقاط دائرياً لمنع تشابك خط الـ X
                        // نقوم بترتيب النقاط بناءً على موقعها الأفقي لتشكيل إطار خارجي سليم ومغلق دائماً
                        const points = [ptA, ptB, ptC, ptD];
                        points.sort((a, b) => a.x - b.x); // ترتيب من اليسار لليمين

                        let leftPoints = [points[0], points[1]];
                        let rightPoints = [points[2], points[3]];

                        // فرز علوي وسفلي لليسار واليمين
                        leftPoints.sort((a, b) => a.y - b.y);
                        rightPoints.sort((a, b) => a.y - b.y);

                        const topLeft = leftPoints[0];
                        const bottomLeft = leftPoints[1];
                        const topRight = rightPoints[0];
                        const bottomRight = rightPoints[1];

                        // 1. رسم تأثيرات الواجهة الرقمية المحشوة بالداخل أولاً
                        drawHologramGrid(topLeft, topRight, bottomRight, bottomLeft);

                        // 2. رسم المستطيل الليزري الخارجي المشع المتوهج بدقة
                        ctx.beginPath();
                        ctx.moveTo(topLeft.x, topLeft.y);
                        ctx.lineTo(topRight.x, topRight.y);
                        ctx.lineTo(bottomRight.x, bottomRight.y);
                        ctx.lineTo(bottomLeft.x, bottomLeft.y);
                        ctx.closePath();

                        ctx.strokeStyle = '#00f3ff';
                        ctx.lineWidth = 4;
                        ctx.shadowBlur = 20;
                        ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    }
                }
            }
        }

        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        hands.setOptions({
            maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.45, minTrackingConfidence: 0.45
        });
        hands.onResults(onResults);

        hands.initialize().then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "بوابة النيون المكتملة مستعدة تماماً!";
            startBtn.style.display = 'block';
        });

        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: 320, height: 240 }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { await hands.send({ image: videoElement }); } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };
                videoElement.onloadedmetadata = () => { videoElement.play().then(() => { processVideo(); }); };
            });
        });
    </script>
</body>
</html>
