<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النيون الهولوغرامية - السوبر باور الكامل</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }

        #container { position: relative; width: 100%; height: 100%; }

        /* الكاميرا تغطي الشاشة بالكامل كخلفية حية */
        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* تفعيل وضع المرآة لتطابق التتبع */
            z-index: 5;
        }

        /* جرافيك الليزر فوق الكاميرا مباشرة مع فلاتر التوهج السينمائي */
        #visuals {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 10;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(0, 243, 255, 0.9)) drop-shadow(0 0 25px rgba(0, 243, 255, 0.4));
        }

        /* واجهة البدء وتخطي قيود الحظر */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #040408; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }

        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }

        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري مزامنة تتبع اليدين وتجهيز بوابة الليزر...</h3>
            </div>
            <button id="start-btn">إطلاق طاقة السوبر باور الثنائية ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        // --- إعداد مشهد الـ Three.js المتوافق مع الشاشة ---
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const renderer = new THREE.WebGLRenderer({ canvas: canvasElement, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);

        // 1. نقاط المفاصل لـ يدين اثنتين (21 مفصل × 2 يد = 42 نقطة)
        const maxHands = 2;
        const totalJoints = 21 * maxHands;
        const dotGeometry = new THREE.BufferGeometry();
        const dotPositions = new Float32Array(totalJoints * 3);
        
        for(let i=0; i<totalJoints; i++) {
            dotPositions[i*3] = dotPositions[i*3+1] = dotPositions[i*3+2] = 9999; // إخفاء خارج الشاشة
        }
        dotGeometry.setAttribute('position', new THREE.BufferAttribute(dotPositions, 3));

        const dotMaterial = new THREE.PointsMaterial({
            color: 0x00f3ff, size: 0.06, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending
        });
        const jointPoints = new THREE.Points(dotGeometry, dotMaterial);
        scene.add(jointPoints);

        // 2. هيكل الخطوط لليدين
        const HAND_CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4], [0,5], [5,6], [6,7], [7,8],
            [5,9], [9,10], [10,11], [11,12], [9,13], [13,14], [14,15], [15,16],
            [0,17], [17,18], [18,19], [19,20], [5,17]
        ];

        const lineGeometries = [];
        const lines = [];

        // إنشاء خطوط الهيكل لليد الأولى والثانية
        for(let h=0; h<maxHands; h++) {
            HAND_CONNECTIONS.forEach(() => {
                const geom = new THREE.BufferGeometry();
                const pos = new Float32Array(2 * 3);
                geom.setAttribute('position', new THREE.BufferAttribute(pos, 3));
                const mat = new THREE.LineBasicMaterial({
                    color: 0x00f3ff, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
                });
                const line = new THREE.Line(geom, mat);
                scene.add(line);
                lines.push(line);
                lineGeometries.push(geom);
            });
        }

        // 3. إنشاء "المستطيل الليزري المركزي الخارق" (بوابة النيون بين اليدين)
        const portalGeometry = new THREE.BufferGeometry();
        const portalPositions = new Float32Array(5 * 3); // 5 نقاط لإغلاق المستطيل بالكامل
        portalGeometry.setAttribute('position', new THREE.BufferAttribute(portalPositions, 3));
        
        const portalMaterial = new THREE.LineBasicMaterial({
            color: 0x00f3ff, transparent: true, opacity: 0.95, blending: THREE.AdditiveBlending, linewidth: 2
        });
        const portalLine = new THREE.Line(portalGeometry, portalMaterial);
        portalLine.visible = false; // لا يظهر إلا عند رصد اليدين معاً
        scene.add(portalLine);


        // --- معالجة حركة اليدين وبناء البوابة ديناميكياً ---
        function onResults(results) {
            const dotPosAttr = dotGeometry.attributes.position;
            let lineIdx = 0;

            // إخفاء كل مفاصل اليدين افتراضياً لتحديثها
            for (let i = 0; i < totalJoints; i++) { dotPosAttr.array[i*3] = 9999; }
            lines.forEach(l => l.visible = false);
            portalLine.visible = false;

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                // مصفوفة لتخزين نقاط التحكم الخاصة بالمستطيل المركزي
                let handCenters = [];

                // المرور على كل يد تم رصدها (بحد أقصى يدين)
                for (let h = 0; h < Math.min(results.multiHandLandmarks.length, maxHands); h++) {
                    const landmarks = results.multiHandLandmarks[h];
                    const offset = h * 21;

                    // تحديث المفاصل الـ 21 الخاصة باليد الحالية
                    for (let i = 0; i < 21; i++) {
                        const pt = landmarks[i];
                        const x = -(pt.x * 2 - 1);
                        const y = -(pt.y * 2 - 1);

                        dotPosAttr.array[(offset + i) * 3] = x;
                        dotPosAttr.array[(offset + i) * 3 + 1] = y;
                        dotPosAttr.array[(offset + i) * 3 + 2] = 0;
                    }

                    // تحديث خطوط الهيكل لليد الحالية
                    HAND_CONNECTIONS.forEach((conn) => {
                        const pt1 = landmarks[conn[0]];
                        const pt2 = landmarks[conn[1]];

                        const x1 = -(pt1.x * 2 - 1); const y1 = -(pt1.y * 2 - 1);
                        const x2 = -(pt2.x * 2 - 1); const y2 = -(pt2.y * 2 - 1);

                        const linePosAttr = lineGeometries[lineIdx].attributes.position;
                        linePosAttr.array[0] = x1; linePosAttr.array[1] = y1; linePosAttr.array[2] = 0;
                        linePosAttr.array[3] = x2; linePosAttr.array[4] = y2; linePosAttr.array[5] = 0;
                        linePosAttr.needsUpdate = true;
                        lines[lineIdx].visible = true;
                        lineIdx++;
                    });

                    // حفظ موقع السبابة (8) والإبهام (4) لليد الحالية لاستخدامها في بناء المستطيل الوسطي
                    handCenters.push({
                        thumb: { x: -(landmarks[4].x * 2 - 1), y: -(landmarks[4].y * 2 - 1) },
                        index: { x: -(landmarks[8].x * 2 - 1), y: -(landmarks[8].y * 2 - 1) }
                    });
                }
                dotPosAttr.needsUpdate = true;

                // 🌟 الشرط السحري: إذا تم رصد يدين اثنتين معاً في الكادر، قم ببناء مستطيل الليزر المركزي!
                if (handCenters.length === 2) {
                    const h1 = handCenters[0];
                    const h2 = handCenters[1];

                    const portalPosAttr = portalGeometry.attributes.position;
                    
                    // بناء أركان المستطيل برمجياً ليربط بين أطراف أصابع اليد الأولى واليد الثانية ديناميكياً
                    portalPosAttr.array[0] = h1.index.x; portalPosAttr.array[1] = h1.index.y; portalPosAttr.array[2] = 0; // ركن 1: سبابة اليد أ
                    portalPosAttr.array[3] = h2.index.x; portalPosAttr.array[4] = h2.index.y; portalPosAttr.array[5] = 0; // ركن 2: سبابة اليد ب
                    portalPosAttr.array[6] = h2.thumb.x; portalPosAttr.array[7] = h2.thumb.y; portalPosAttr.array[8] = 0; // ركن 3: إبهام اليد ب
                    portalPosAttr.array[9] = h1.thumb.x; portalPosAttr.array[10] = h1.thumb.y; portalPosAttr.array[11] = 0; // ركن 4: إبهام اليد أ
                    portalPosAttr.array[12] = h1.index.x; portalPosAttr.array[13] = h1.index.y; portalPosAttr.array[14] = 0; // إغلاق المستطيل

                    portalPosAttr.needsUpdate = true;
                    portalLine.visible = true; // إظهار المستطيل المتوهج فوراً
                }
            }

            renderer.render(scene, camera);
        }

        // --- تشغيل ومزامنة الكاميرا والذكاء الاصطناعي ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        // تم ضبط الحسابات لتعمل على يدين اثنتين بدقة وسرعة متوازنة تناسب معالج الـ A51
        hands.setOptions({
            maxNumHands: 2, modelComplexity: 0, minDetectionConfidence: 0.45, minTrackingConfidence: 0.45
        });
        hands.onResults(onResults);

        hands.initialize().then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "طاقة البوابة مستعدة تماماً!";
            startBtn.style.display = 'block';
        });

        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 480 }, height: { ideal: 360 } }, // دقة مثالية وسريعة جداً للموبايل
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { await hands.send({ image: videoElement }); } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };

                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(() => { processVideo(); });
                };
            })
            .catch(error => {
                alert("برجاء إعطاء صلاحية الكاميرا للمتصفح: " + error.message);
            });
        });

        window.addEventListener('resize', () => {
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
