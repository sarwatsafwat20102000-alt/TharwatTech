<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة النيون - تتبع اليدين المتكامل</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #000; font-family: sans-serif;
        }

        #container { position: relative; width: 100%; height: 100%; }

        /* الكاميرا تغطي الخلفية بالكامل */
        #webcam {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; object-fit: cover;
            transform: scaleX(-1); /* وضع المرآة المطابق للحركة */
            z-index: 5;
        }

        /* شاشة الرسم السريعة والمحسنة فوق الكاميرا مباشرة */
        #visuals {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 10;
            pointer-events: none;
        }

        /* واجهة التحميل والبدء */
        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #05050a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #00f3ff;
            z-index: 100; text-shadow: 0 0 10px #00f3ff; padding: 20px; text-align: center;
        }

        .spinner {
            border: 4px solid rgba(0, 243, 255, 0.1); width: 45px; height: 45px;
            border-radius: 50%; border-left-color: #00f3ff;
            animation: spin 1s linear infinite; margin-bottom: 20px;
        }

        #start-btn {
            display: none; background: transparent; color: #00f3ff;
            border: 2px solid #00f3ff; padding: 14px 35px; font-size: 18px;
            font-weight: bold; border-radius: 25px; cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3); transition: all 0.3s;
        }

        #start-btn:active { transform: scale(0.95); background: #00f3ff; color: #000; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="container">
        <div id="loading-overlay">
            <div id="status-container">
                <div class="spinner"></div>
                <h3 id="loading-text">جاري إجبار النظام على تفعيل تتبع اليدين معاً...</h3>
            </div>
            <button id="start-btn">تفعيل السوبر باور الثنائي ⚡</button>
        </div>

        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="visuals"></canvas>
    </div>

    <script>
        const videoElement = document.getElementById('webcam');
        const canvasElement = document.getElementById('visuals');
        const ctx = canvasElement.getContext('2d');
        const loadingOverlay = document.getElementById('loading-overlay');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');
        const spinner = document.querySelector('.spinner');

        // ضبط أبعاد شاشة الرسم لتطابق أبعاد الشاشة الحقيقية
        function resizeCanvas() {
            canvasElement.width = window.innerWidth;
            canvasElement.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // الروابط البرمجية لتوصيل مفاصل اليد (21 مفصل)
        const CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4],       
            [0,5], [5,6], [6,7], [7,8],       
            [5,9], [9,10], [10,11], [11,12],  
            [9,13], [13,14], [14,15], [15,16], 
            [0,17], [17,18], [18,19], [19,20], 
            [5,17] 
        ];

        // --- معالجة البيانات والرسم الفوري ثنائي الأبعاد عالي الأداء ---
        function onResults(results) {
            // مسح الشاشة في كل إطار استعداداً للرسم الجديد
            ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                
                let handPoints = []; // مصفوفة لحفظ نقاط أصابع اليدين

                // تكرار الرسم لكل يد يتم رصدها (الآن سيرى اليدين معاً بنجاح)
                for (const landmarks of results.multiHandLandmarks) {
                    
                    // 1. رسم خطوط الهيكل العظمي لكل يد بتوهج نيون
                    CONNECTIONS.forEach((conn) => {
                        const pt1 = landmarks[conn[0]];
                        const pt2 = landmarks[conn[1]];

                        ctx.beginPath();
                        // تحويل الإحداثيات لتتطابق مع أبعاد شاشتك والـ Mirror
                        ctx.moveTo((1 - pt1.x) * canvasElement.width, pt1.y * canvasElement.height);
                        ctx.lineTo((1 - pt2.x) * canvasElement.width, pt2.y * canvasElement.height);
                        
                        // فلاتر التوهج النيوني السريع
                        ctx.strokeStyle = '#00f3ff';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 15;
                        ctx.shadowColor = '#00f3ff';
                        ctx.stroke();
                    });

                    // 2. رسم النقاط المضيئة فوق المفاصل الـ 21
                    landmarks.forEach((pt) => {
                        ctx.beginPath();
                        ctx.arc((1 - pt.x) * canvasElement.width, pt.y * canvasElement.height, 5, 0, 2 * Math.PI);
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = '#00f3ff';
                        ctx.fill();
                    });

                    // حفظ موقع السبابة (8) والإبهام (4) لليد الحالية
                    handPoints.push({
                        thumb: { x: (1 - landmarks[4].x) * canvasElement.width, y: landmarks[4].y * canvasElement.height },
                        index: { x: (1 - landmarks[8].x) * canvasElement.width, y: landmarks[8].y * canvasElement.height }
                    });
                }

                // 🌟 الشرط السحري: إذا رأى الذكاء الاصطناعي اليدين معاً (handPoints يحتوي على عنصرين)
                if (handPoints.length === 2) {
                    const hand1 = handPoints[0];
                    const hand2 = handPoints[1];

                    // رسم المستطيل الليزري المركزي المشع الذي يربط بين أصابع اليدين
                    ctx.beginPath();
                    ctx.moveTo(hand1.index.x, hand1.index.y); // سبابة اليد 1
                    ctx.lineTo(hand2.index.x, hand2.index.y); // سبابة اليد 2
                    ctx.lineTo(hand2.thumb.x, hand2.thumb.y); // إبهام اليد 2
                    ctx.lineTo(hand1.thumb.x, hand1.thumb.y); // إبهام اليد 1
                    ctx.closePath(); // إغلاق المستطيل تلقائياً

                    // ستايل المستطيل الليزري المتوهج (تطابق تام مع فيديو فيسبوك)
                    ctx.strokeStyle = '#00f3ff';
                    ctx.lineWidth = 5; // خط عريض وواضح
                    ctx.shadowBlur = 25; // هالة توهج عريضة جداً
                    ctx.shadowColor = '#00f3ff';
                    ctx.stroke();

                    // ملء المستطيل من الداخل بلون أزرق ليزري شفاف جداً لإعطاء مظهر الشاشة الهولوغرامية
                    ctx.fillStyle = 'rgba(0, 243, 255, 0.08)';
                    ctx.fill();
                }
            }
        }

        // --- تشغيل ومزامنة النظام بالكامل ---
        const hands = new Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
        });

        // تغيير معيار التعرف لجعل المتصفح يركز بقوة على اليدين معاً (maxNumHands: 2)
        hands.setOptions({
            maxNumHands: 2,
            modelComplexity: 1, // استخدام النموذج الاحترافي الكامل لليدين
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        hands.onResults(onResults);

        hands.initialize().then(() => {
            spinner.style.display = 'none';
            loadingText.innerText = "اكتمل الكود الخارق! ارفع يديك الإثنتين معاً الآن.";
            startBtn.style.display = 'block';
        });

        startBtn.addEventListener('click', () => {
            loadingOverlay.style.opacity = '0';
            setTimeout(() => loadingOverlay.style.display = 'none', 500);

            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } }, 
                audio: false 
            })
            .then((stream) => {
                videoElement.srcObject = stream;
                
                const processVideo = async () => {
                    if (!videoElement.paused && !videoElement.ended) {
                        try { await hands.send({ image: videoElement }); } catch (e) {}
                    }
                    requestAnimationFrame(processVideo);
                };

                videoElement.onloadedmetadata = () => {
                    videoElement.play().then(() => { processVideo(); });
                };
            })
            .catch(error => {
                alert("برجاء إعطاء المتصفح صلاحية فتح الكاميرا: " + error.message);
            });
        });
    </script>
</body>
</html>
